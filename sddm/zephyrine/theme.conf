; Настройки темы zephyrine. Цвета — hex без '#' (как в scheme.json Quickshell-бара).
; Локальные правки лучше класть в theme.conf.user рядом (он перекрывает этот файл).
[General]
; Видео-фон: путь относительно каталога темы. Скрипт install-theme.sh копирует
; сюда mp4 (greeter работает от пользователя sddm и не читает /home/$USER).
video=assets/background.mp4
; Затемнение поверх видео (0..1): сверху и снизу
dimTop=0.55
dimBottom=0.70

; Показывать поле логина (true) или только выбор пользователя + пароль (false)
showLoginField=true

; Шрифт и скругления
fontFamily=JetBrainsMono Nerd Font
fontSize=14
barRadius=14
cardRadius=18
pillRadius=12
barMargin=6

; Прозрачность панелей и анимации
panelAlpha=0.85
cardAlpha=0.86
animMs=200

; Палитра obsidian-neon (значения из scheme.json)
background=141414
surfaceContainer=1c1d2b
surfaceContainerHigh=242538
surfaceContainerHighest=303249
fg=e8e8f0
fgVariant=c0c0cc
outline=7f88b5
outlineVariant=41466a
primary=bb9af7
primaryText=2a1a33
primaryContainer=4b3161
secondary=7aa2f7
tertiary=2ac3de
error=f7768e
errorText=4a0d17
success=9ece6a
