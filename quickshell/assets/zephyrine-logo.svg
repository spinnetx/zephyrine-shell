<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Основной градиент потоков ветра -->
    <linearGradient id="zGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="35%" stop-color="#2ac3de"/>
      <stop offset="75%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#89ddff"/>
    </linearGradient>

    <!-- Верхний поток ветра -->
    <linearGradient id="topStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="60%" stop-color="#2ac3de"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>

    <!-- Нижний поток ветра -->
    <linearGradient id="botStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ac3de"/>
      <stop offset="50%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>

    <!-- Мягкая подсветка / свечение -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Стилизованная монограмма Zephyrine (Concept 3: Nordic Wind Swirl Z) -->
  <g filter="url(#softGlow)">
    <!-- Верхняя ветвь бриза -->
    <path d="M 52 74 C 52 50, 74 38, 98 38 L 180 38 C 196 38, 206 48, 206 64 C 206 78, 196 86, 182 86 L 126 86 C 104 86, 90 98, 90 114 C 90 126, 98 136, 114 146 L 168 180 C 192 196, 206 210, 206 230 C 206 242, 196 248, 186 248 C 160 248, 142 228, 134 212 L 86 172 C 64 154, 52 136, 52 112 C 52 98, 58 86, 72 78 C 58 78, 52 74, 52 74 Z"
          fill="url(#topStream)" opacity="0.95"/>

    <!-- Центральный динамичный диагональный вихрь -->
    <path d="M 188 56 L 82 186 C 70 200, 60 216, 68 232 C 74 244, 88 248, 102 248 L 184 248 C 208 248, 222 232, 222 214 C 222 196, 208 184, 190 184 L 140 184 C 120 184, 112 174, 114 162 C 116 150, 126 140, 144 126 L 188 92 C 208 76, 218 64, 214 52 C 210 42, 198 44, 188 56 Z"
          fill="url(#zGradient)" opacity="0.9"/>

    <!-- Внутренний блик света -->
    <path d="M 88 50 L 176 50 C 188 50, 196 56, 196 64"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 174 72 L 96 166"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    <path d="M 84 236 L 176 236 C 190 236, 204 228, 204 216"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>
</svg>
