# hypridle — демон управления простоем сессии для Hyprland.
# В старом my_config его не было вообще (bare-конфиг). Здесь — консервативный
# набор таймаутов для десктопного сценария с внешним монитором (DP-6):
# не агрессивный auto-suspend, только затемнение → лок → dpms off.
# См. https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Скрипт сам проверяет pidof hyprlock и поднимает видео за прозрачным hyprlock.
    lock_cmd = zephyrine-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({action=\"on\"})"
}

# ~2.5 минуты бездействия — плавное затемнение подсветки (ноутбучный экран).
# Восстанавливаем яркость при любой активности (resume).
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Автолок по бездействию отключён (2026-09-12) — пользователь хочет
# блокировать экран исключительно вручную (SUPER+L). Было: ~5 минут бездействия -> блокировка тем же вызовом.
# Раскомментировать, если понадобится обратно:
# listener {
#     timeout = 300
#     on-timeout = loginctl lock-session
# }

# ~5.5 минуты — гасим экран через dpms, включаем обратно при любой активности.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch "hl.dsp.dpms({action=\"off\"})"
    on-resume = hyprctl dispatch "hl.dsp.dpms({action=\"on\"})"
}

# Suspend по таймауту отключён по умолчанию: сценарий десктопный (ноутбук
# закрыт/используется с внешним монитором DP-6, крышка обычно не закрыта),
# и агрессивный auto-suspend там нежелателен. Раскомментируйте и подберите
# таймаут сами, если нужно:
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
